<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Reaction Trainer Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contenedores de Información -->
    <div id="ui-container">
        <div id="temporizador" class="oculto">0:60</div>
        <div id="conteo-fallos-exterior" class="oculto">Fallos: 0</div>
        <div id="conteo-aciertos" class="oculto">Aciertos: 0</div>
    </div>

    <!-- Objetivo del Juego -->
    <button id="btn-circulo" class="oculto"></button>

    <!-- Menú Principal -->
    <div id="modal-inicio-juego">
        <div class="modal-contenido">
            <h1 class="titulo-neon">REACTION TRAINER</h1>
            <div id="grid-inicio" class="pc-layout">
                <div class="modal-columna">
                    <h3>OBJETIVO</h3>
                    <p>Haz clic en el círculo verde lo más rápido que puedas.</p>
                </div>
                <div class="modal-columna">
                    <h3>HARDWARE</h3>
                    <p>Detección automática de latencia y periféricos activa.</p>
                </div>
            </div>
            <button id="btn-iniciar">COMENZAR PRUEBA</button>
        </div>
    </div>

    <!-- Resultados -->
    <div id="modal-fin-juego" class="oculto">
        <div class="modal-contenido">
            <h2>SESIÓN COMPLETADA</h2>
            <p>Aciertos Totales: <span id="final-aciertos">0</span></p>
            <p>Velocidad Media: <span id="tiempo-reaccion-estimado">0</span> ms</p>
            <button onclick="location.reload()">REINTENTAR</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
