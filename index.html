<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Reaction Trainer Pro | High Performance Build</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Capa de Interfaz de Usuario (HUD) -->
    <div id="hud-container" class="hidden">
        <div class="stat-box" id="stat-timer">
            <span class="label">TIEMPO</span>
            <span class="value" id="timer-val">01:00</span>
        </div>
        <div class="stat-box" id="stat-misses">
            <span class="label">FALLOS</span>
            <span class="value" id="misses-val">0</span>
        </div>
        <div class="stat-box" id="stat-hits">
            <span class="label">ACIERTOS</span>
            <span class="value" id="hits-val">0</span>
        </div>
    </div>

    <!-- Objetivo Principal -->
    <button id="game-target" class="hidden"></button>

    <!-- Modal de Inicio -->
    <div id="modal-start" class="modal-overlay">
        <div class="modal-card">
            <h1 class="glow-text">REACTION PRO</h1>
            <div class="hardware-info">
                <p><strong>SISTEMA:</strong> Optimización Ryzen 5 / RX Series</p>
                <p><strong>ESTADO:</strong> GitHub Pages Link Active</p>
            </div>
            <div class="instructions">
                <p>Haz clic en los objetivos verdes lo más rápido posible.</p>
                <p>Los clics fallidos penalizan la pantalla.</p>
            </div>
            <button id="btn-play-now" class="primary-btn">INICIAR ENTRENAMIENTO</button>
        </div>
    </div>

    <!-- Modal de Resultados -->
    <div id="modal-results" class="modal-overlay hidden">
        <div class="modal-card">
            <h2 class="glow-text">RENDIMIENTO FINAL</h2>
            <div class="results-grid">
                <div class="res-item">
                    <span class="res-label">Total Aciertos</span>
                    <span class="res-value" id="final-hits">0</span>
                </div>
                <div class="res-item">
                    <span class="res-label">Precisión</span>
                    <span class="res-value" id="final-accuracy">0%</span>
                </div>
                <div class="res-item">
                    <span class="res-label">Reacción Media</span>
                    <span class="res-value" id="final-ms">0 ms</span>
                </div>
            </div>
            <button class="primary-btn" onclick="location.reload()">REINTENTAR</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
