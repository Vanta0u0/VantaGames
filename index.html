<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Reaction Trainer Elite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-overlay" class="oculto">
        <div class="indicador" id="timer-box">
            <span class="etiqueta">TIEMPO</span>
            <span class="valor" id="reloj">01:00</span>
        </div>
        <div class="indicador" id="hits-box">
            <span class="etiqueta">ACIERTOS</span>
            <span class="valor" id="puntos">0</span>
        </div>
        <div class="indicador" id="miss-box">
            <span class="etiqueta">FALLOS</span>
            <span class="valor" id="fallos">0</span>
        </div>
    </div>

    <button id="target-circle" class="oculto"></button>

    <div id="pantalla-inicio" class="overlay-full">
        <div class="panel-central">
            <h1 class="texto-glow">REACTION TRAINER</h1>
            <div class="monitor-hardware">
                <p>SISTEMA: Ryzen 5 & Radeon RX Series</p>
                <p>SYNC: GitHub Pages Build v9.5</p>
            </div>
            <button id="boton-iniciar" class="btn-principal">COMENZAR ENTRENAMIENTO</button>
        </div>
    </div>

    <div id="pantalla-final" class="overlay-full oculto">
        <div class="panel-central">
            <h2 class="texto-glow">INFORME FINAL</h2>
            <div class="grid-resultados">
                <div class="dato"><span class="label">ACIERTOS</span><span class="res" id="res-aciertos">0</span></div>
                <div class="dato"><span class="label">REACCIÓN</span><span class="res" id="res-tiempo">0 ms</span></div>
                <div class="dato"><span class="label">PRECISIÓN</span><span class="res" id="res-precision">0%</span></div>
            </div>
            <button class="btn-principal" onclick="location.reload()">REINTENTAR</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
