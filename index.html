<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Reaction Trainer - Final Stable Build</title>
    <!-- Enlace directo sin ./ para máxima compatibilidad con GitHub -->
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <!-- Capa de Seguridad para evitar parpadeos -->
    <div id="game-viewport">
        <div id="ui-layer" class="hidden">
            <div id="temporizador">0:60</div>
            <div id="conteo-fallos">Fallos: 0</div>
            <div id="conteo-aciertos">Aciertos: 0</div>
        </div>

        <button id="target" class="hidden"></button>

        <div id="menu-inicio" class="modal">
            <div class="modal-box">
                <h1 class="neon-text">REACTION PRO</h1>
                <div id="device-info">
                    <div class="info-card">
                        <h4>HARDWARE</h4>
                        <p>Ryzen 5 / Radeon RX Detected</p>
                    </div>
                    <div class="info-card">
                        <h4>SYNC</h4>
                        <p>GitHub Pages Optimized</p>
                    </div>
                </div>
                <button id="start-trigger">INICIAR SESIÓN</button>
            </div>
        </div>

        <div id="menu-fin" class="modal hidden">
            <div class="modal-box">
                <h2>RESULTADOS</h2>
                <p>Aciertos: <span id="res-aciertos">0</span></p>
                <p>Fallos: <span id="res-fallos">0</span></p>
                <p>Velocidad: <span id="res-ms">0</span> ms</p>
                <button onclick="location.reload()">REINTENTAR</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
